services:
  - type: web
    name: amorvi
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://amorvi-ce0c.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: amorvi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
